:root {
 --ink: #18304a;
 --muted: #50627a;
 --blue: #2563eb;
 --cyan: #06b6d4;
 --green: #10b981;
 --yellow: #f59e0b;
 --orange: #f97316;
 --pink: #ec4899;
 --purple: #7c3aed;
}

section {
 background:
  radial-gradient(circle at 8% 12%, rgba(236, 72, 153, 0.18), transparent 26%),
  radial-gradient(circle at 88% 15%, rgba(6, 182, 212, 0.18), transparent 28%),
  linear-gradient(135deg, #fff7ed 0%, #eef2ff 48%, #ecfeff 100%);
 color: var(--ink);
 font-family: 'Noto Sans TC', 'PingFang HK', 'Microsoft JhengHei', sans-serif;
 font-size: 24px;
 line-height: 1.55;
 padding: 56px 76px;
}

section::before {
 content: &quot;&quot;;
 position: absolute;
 inset: 18px;
 border: 2px solid rgba(37, 99, 235, 0.12);
 border-radius: 26px;
 pointer-events: none;
}

h1 {
 color: #10213a;
 font-weight: 900;
 font-size: 48px;
 letter-spacing: -0.5px;
 margin: 0 0 20px;
}

h2 {
 color: #10213a;
 font-weight: 800;
 font-size: 34px;
 margin: 0 0 18px;
}

strong { color: #10213a; font-weight: 800; }
em { color: var(--muted); }
ul, ol { padding-left: 1.35em; }
li + li { margin-top: 8px; }

.center {
 align-items: center;
 display: flex;
 flex-direction: column;
 justify-content: center;
 text-align: center;
}

.title {
 background: linear-gradient(135deg, #10213a 0%, #2563eb 45%, #ec4899 100%);
 color: white;
}

.title::before, .image-slide::before { display: none; }

.title h1 {
 color: white;
 font-size: 58px;
 line-height: 1.18;
 text-shadow: 0 10px 30px rgba(15, 23, 42, 0.28);
}

.title .card {
 background: rgba(255, 255, 255, 0.92);
 color: var(--ink);
 width: 620px;
}

.section {
 background:
  linear-gradient(135deg, rgba(16, 33, 58, 0.95), rgba(37, 99, 235, 0.92)),
  radial-gradient(circle at 80% 20%, rgba(236, 72, 153, 0.35), transparent 32%);
 color: white;
}

.section h1, .section p { color: white; }

.pill {
 background: linear-gradient(90deg, var(--yellow), var(--orange));
 border-radius: 9999px;
 box-shadow: 0 10px 22px rgba(249, 115, 22, 0.22);
 color: #111827;
 display: inline-block;
 font-size: 19px;
 font-weight: 800;
 margin-bottom: 20px;
 padding: 8px 22px;
}

.card {
 background: rgba(255, 255, 255, 0.9);
 border: 1px solid rgba(37, 99, 235, 0.18);
 border-radius: 22px;
 box-shadow: 0 18px 44px rgba(37, 99, 235, 0.12);
 padding: 28px 32px;
}

.grid-2 {
 display: grid;
 gap: 22px;
 grid-template-columns: 1fr 1fr;
}

.metric {
 background: white;
 border-radius: 20px;
 box-shadow: 0 14px 30px rgba(15, 23, 42, 0.1);
 padding: 22px;
}

.metric strong {
 display: block;
 font-size: 34px;
 line-height: 1;
 margin-bottom: 10px;
}

.tip {
 background: rgba(6, 182, 212, 0.12);
 border-left: 8px solid var(--cyan);
 border-radius: 18px;
 color: var(--ink);
 margin-top: 22px;
 padding: 18px 22px;
}

.warning {
 background: rgba(249, 115, 22, 0.14);
 border-left: 8px solid var(--orange);
 border-radius: 18px;
 color: var(--ink);
 margin-top: 22px;
 padding: 18px 22px;
}

.code-block {
 background: #10213a;
 border-radius: 18px;
 color: #ffffff;
 font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
 font-size: 26px;
 padding: 24px;
}

.timeline {
 display: grid;
 gap: 13px;
 margin-top: 20px;
}

.timeline-row {
 align-items: center;
 display: grid;
 gap: 14px;
 grid-template-columns: 265px 1fr 72px;
}

.bar {
 border-radius: 999px;
 color: white;
 font-size: 18px;
 font-weight: 800;
 padding: 8px 16px;
}

.w-30 { width: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
.w-15 { width: 50%; background: linear-gradient(90deg, var(--green), var(--cyan)); }
.w-10 { width: 34%; background: linear-gradient(90deg, var(--yellow), var(--orange)); }
.w-5 { width: 18%; background: linear-gradient(90deg, var(--pink), var(--purple)); }

.flow {
 align-items: stretch;
 display: grid;
 gap: 16px;
 grid-template-columns: repeat(5, 1fr);
 margin-top: 28px;
}

.flow-step {
 background: white;
 border-top: 10px solid var(--blue);
 border-radius: 20px;
 box-shadow: 0 14px 30px rgba(15, 23, 42, 0.1);
 min-height: 150px;
 padding: 20px 16px;
 text-align: center;
}

.flow-step:nth-child(2) { border-color: var(--cyan); }
.flow-step:nth-child(3) { border-color: var(--green); }
.flow-step:nth-child(4) { border-color: var(--yellow); }
.flow-step:nth-child(5) { border-color: var(--pink); }

.flow-step strong {
 display: block;
 font-size: 24px;
 margin-bottom: 8px;
}

<h1 id="%E7%94%9A%E9%BA%BC%E6%98%AF-tokenization">甚麼是 Tokenization？</h1>
<div class="card">
 <p>Tokenization 是把句子拆分成較小單位 (Token) 的過程。</p>
 <p>例如：「我愛旅行」可被拆分為「我」、「愛」、「旅行」。模型處理的不是文字本身，而是由 Token 轉換而成的數值向量。</p>
</div>
<div class="flow">
 <div class="flow-step"><strong>句子</strong>我愛旅行</div>
 <div class="flow-step"><strong>Token</strong>我 / 愛 / 旅行</div>
 <div class="flow-step"><strong>向量</strong>數值表示</div>
 <div class="flow-step"><strong>模型</strong>分析關係</div>
 <div class="flow-step"><strong>輸出</strong>文字或圖像指令</div>
</div>
</section>

<h1 id="%E7%B0%A1%E5%8C%96%E8%88%87%E8%AD%98%E5%88%A5">簡化與識別</h1>
<div class="card">
 <p>小孩的簡單線條捕捉了汽車的「本質」：四個輪子、一個車身、一扇窗。不需要逼真的細節，我們仍能識別出這是一輛車。</p>
 <p>AI 的工作原理也是如此。它學會把圖像「壓縮」成最重要的特徵，忽略無關的細節。這個概念就是 <strong>潛在空間</strong>。</p>

 </ul>
